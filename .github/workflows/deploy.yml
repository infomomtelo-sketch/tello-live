# Deploys tello.live to Cloudflare whenever main changes.
# Needs the repository secret CLOUDFLARE_API_TOKEN (Settings > Secrets and variables > Actions).
# Optional secrets copied to the Worker when set:
# STRIPE_SECRET_KEY, ANTHROPIC_API_KEY, RESEND_API_KEY, ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID, DEEPINFRA_API_KEY.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      # The account id is not a secret (it is the same account the old workflow used); a CLOUDFLARE_ACCOUNT_ID secret overrides it.
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '701117dde6af00d42bac3c4058b660be' }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # Until the token is added here, the ec-rental repo's "Deploy tello-live" workflow deploys this Worker instead.
      - name: Check for the Cloudflare token
        id: token
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::warning::No CLOUDFLARE_API_TOKEN secret yet (Settings > Secrets and variables > Actions), so nothing was deployed."
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Deploy
        if: steps.token.outputs.ok == 'true'
        run: npx wrangler deploy
      # No database step while the database is shared: ec-rental's deploy already creates every table in schema.sql
      # (they are a subset of its own), and this repo's token does not need D1 permissions.
      - name: Copy API keys to the Worker
        if: steps.token.outputs.ok == 'true'
        env:
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          node -e '
            const out = {};
            for (const k of ["STRIPE_SECRET_KEY","ANTHROPIC_API_KEY","RESEND_API_KEY","ELEVENLABS_API_KEY","ELEVENLABS_VOICE_ID","DEEPINFRA_API_KEY"]) if (process.env[k] && process.env[k].trim()) out[k] = process.env[k].trim();
            process.stdout.write(JSON.stringify(out));
          ' > secrets.json
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; else echo "No keys set in GitHub; leaving the Worker's secrets as they are."; fi
          rm secrets.json
      - name: Check the deployed pages
        if: steps.token.outputs.ok == 'true'
        run: scripts/smoke.sh https://tello-live.infomomtelo.workers.dev
      - name: Check tello.live itself
        if: steps.token.outputs.ok == 'true'
        run: scripts/smoke.sh https://tello.live
      # Tell Bing, Yandex and other IndexNow engines about public pages that changed. The key file is in public/.
      - name: Ping search engines about changed pages (IndexNow)
        if: steps.token.outputs.ok == 'true'
        continue-on-error: true
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          if [ -n "$BEFORE" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            files=$(git diff --name-only "$BEFORE" HEAD -- 'public/*.html' || true)
          else
            files="public/hub.html"
          fi
          urls=$(for f in $files; do [ -f "$f" ] || continue; case "$f" in public/*/*|public/b.html) continue;; esac; p="${f#public/}"; p="${p%.html}"; [ "$p" = "hub" ] && p=""; echo "https://tello.live/$p"; done)
          if [ -z "$urls" ]; then echo "No public pages changed."; exit 0; fi
          echo "$urls"
          body=$(printf '%s\n' $urls | jq -R . | jq -s '{host: "tello.live", key: "1842a03c0db4f7bd68c1e491cb74e176", keyLocation: "https://tello.live/1842a03c0db4f7bd68c1e491cb74e176.txt", urlList: .}')
          curl -sS -o /dev/null -w "IndexNow answered %{http_code}\n" -X POST https://api.indexnow.org/indexnow -H 'Content-Type: application/json; charset=utf-8' -d "$body"
