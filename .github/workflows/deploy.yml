# Deploys tello.live to Cloudflare whenever main changes.
# Needs the repository secret CLOUDFLARE_API_TOKEN and the variable/secret CLOUDFLARE_ACCOUNT_ID
# (Settings > Secrets and variables > Actions). Optional secrets copied to the Worker when set:
# ANTHROPIC_API_KEY, RESEND_API_KEY, ELEVENLABS_API_KEY, ELEVENLABS_VOICE_ID, DEEPINFRA_API_KEY.
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - name: Check for the Cloudflare secrets
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ] || [ -z "$CLOUDFLARE_ACCOUNT_ID" ]; then
            echo "::error::Add CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID under Settings > Secrets and variables > Actions, then re-run."
            exit 1
          fi
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run typecheck
      # First deploy creates the D1 database (wrangler provisions it); schema.sql is idempotent.
      - name: Deploy
        run: npx wrangler deploy
      - name: Update the database tables
        run: npm run db:init
      - name: Copy API keys to the Worker
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ secrets.ELEVENLABS_VOICE_ID }}
          DEEPINFRA_API_KEY: ${{ secrets.DEEPINFRA_API_KEY }}
        run: |
          node -e '
            const out = {};
            for (const k of ["ANTHROPIC_API_KEY","RESEND_API_KEY","ELEVENLABS_API_KEY","ELEVENLABS_VOICE_ID","DEEPINFRA_API_KEY"]) if (process.env[k] && process.env[k].trim()) out[k] = process.env[k].trim();
            process.stdout.write(JSON.stringify(out));
          ' > secrets.json
          if [ "$(cat secrets.json)" != "{}" ]; then npx wrangler secret bulk secrets.json; else echo "No keys set in GitHub; leaving the Worker's secrets as they are."; fi
          rm secrets.json
