name = "tello-live"
main = "src/index.ts"
compatibility_date = "2026-09-25"
compatibility_flags = ["nodejs_compat"]

workers_dev = true
# The custom domain is deliberately NOT routed here yet: tello.live is still served by the ec-rental-landing-page
# Worker. Uncomment these at cutover (see docs/CUTOVER.md); deploying them moves the domain.
# routes = [
#   { pattern = "tello.live", custom_domain = true },
#   { pattern = "www.tello.live", custom_domain = true },
# ]

# Daily jobs (src/index.ts scheduled): Green Tello morning briefings. 16:00 UTC is 9am in Fresno (8am in winter).
# Off until cutover. The daily run also sets up this Worker's Stripe webhook for https://tello.live, which replaces
# the endpoint the ec-rental Worker uses today, so it must only start together with the routes above.
# [triggers]
# crons = ["0 16 * * *"]

[ai]
binding = "AI"

[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "404-page"
run_worker_first = ["/", "/api/*", "/embed/*", "/media/*", "/b/*", "/build", "/business.html", "/privacy", "/terms"]

# Tello's own database. No database_id: wrangler creates it on the first deploy and records the id.
[[d1_databases]]
binding = "DB"
database_name = "tello-live-db"

# Photos customers attach to messages for businesses that turn uploads on. wrangler creates the bucket on first deploy.
[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "tello-live-photos"

[vars]
# Must be an address on a domain verified in Resend. RESEND_API_KEY is a secret. Only ecrentalpm.com is verified in
# Resend today; switch to an @tello.live address once tello.live is verified there.
EMAIL_FROM = "Tello <info@ecrentalpm.com>"
# Anthropic prices for the daily spend cap, and the cap itself (Claude Sonnet 5.5: $2/M input, $10/M output; search $10/1,000).
# When the day's spend reaches HUB_DAILY_CENTS (500 = $5), the chat switches to the free Workers AI model until midnight UTC.
HUB_IN_PER_M = "2"
HUB_OUT_PER_M = "10"
HUB_SEARCH_PER_K = "10"
HUB_DAILY_CENTS = "500"
BIZ_DAILY_CENTS = "1000"
APP_DAILY_CENTS = "1500"

# Per-IP limit for the AI chat.
[[ratelimits]]
name = "CHAT_LIMITER"
namespace_id = "2002"
simple = { limit = 20, period = 60 }
